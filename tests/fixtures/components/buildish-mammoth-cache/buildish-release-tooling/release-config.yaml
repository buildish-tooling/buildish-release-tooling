# Hypothetical Apache-project fixture. The parent directory selects a matrix
# scenario; this is not release configuration for the Buildish component.

component:
  id: example-action
  display_name: Apache Example Action
versioning:
  scheme: semver
  final_tag_template: "v{version}"
source:
  selection: release-branch
  snapshot:
    mode: built-asset
    filename_template: "apache-example-action-{version}-incubating-src.tar.gz"
    archive_root_template: "apache-example-action-{version}-incubating-src"
  checks:
    platform: github
    required:
      - component-ci
lifecycle:
  mode: candidate
candidate:
  label: rc
  start_number: 1
  visibility: public-prerelease
  retention: retain-published
artifacts:
  produced: []
  checksums: [sha512]
  signing:
    kind: openpgp
    private_key_env: BUILDISH_GPG_PRIVATE_KEY
    passphrase_env: BUILDISH_GPG_PASSPHRASE
publication:
  authoritative:
    kind: asf-dist-svn
  convenience:
    - kind: github-release
  secondary:
    - kind: github-action
tags:
  final_mode: detached-materialization-commit
  moving: [major, minor]
  include_final_mode_in_summary: true
vote_materials:
  profile: asf
  release_name: Apache Example Action
  verification_guide_url: https://example.apache.org/action/release-verification/
  instructions: |
    Verify checksums and signatures, rebuild the source release and dist/, and compare outputs.
policy_profiles:
  asf:
    project_status: incubating
    dist_dev_base: https://dist.apache.org/repos/dist/dev/incubator/example/example-action
    dist_release_base: https://dist.apache.org/repos/dist/release/incubator/example/example-action
    keys_url: https://downloads.apache.org/incubator/example/KEYS
    disclaimer_file: DISCLAIMER
