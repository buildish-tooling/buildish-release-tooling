component_id: buildish-site-pipeline
source_artifact_prefix: apache-buildish-site-pipeline
asf_dist_dev_base: https://dist.apache.org/repos/dist/dev/incubator/buildish/buildish-site-pipeline
asf_dist_release_base: https://dist.apache.org/repos/dist/release/incubator/buildish/buildish-site-pipeline
moving_tags_enabled: true
latest_tag_enabled: false
secondary_targets:
  - pypi
  - dockerhub
final_tag_mode: rc-source-commit
vote_release_name: Apache Buildish Site Pipeline
incubator_vote_enabled: false
release_summary_include_final_tag_mode: false
release_verification_guide_url: https://buildish.apache.org/buildish-site-pipeline/release-verification/
verify_rc_instructions: |
  Run this bash verification flow on trusted Linux or macOS hardware:
  1. verify .sha512
  2. verify .asc
  3. rebuild source release
  4. rebuild wheel/sdist
  5. rebuild container image metadata
  6. compare staged and rebuilt outputs
prepare_rc_runs_tests: false
release_branch_ci_required: true
