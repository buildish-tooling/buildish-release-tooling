name: Releasey Verify RC

on:
  workflow_dispatch:
    inputs:
      rc_vote_manifest_url:
        description: Exact rc-vote-manifest.json URL to verify
        required: true
        type: string
      keys_url:
        description: Explicit KEYS URL expected by the signed manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Draft RC verification
        env:
          RC_VOTE_MANIFEST_URL: ${{ inputs.rc_vote_manifest_url }}
          KEYS_URL: ${{ inputs.keys_url }}
        run: |
          # CI uses only canonical reproducibility profiles from release-config.yaml.
          # Human local runs may opt into --repro-override-file, but that is intentionally
          # not part of this workflow contract.
          bash buildish-release-tooling/release-tooling.sh verify-rc \
            "$RC_VOTE_MANIFEST_URL" \
            "$KEYS_URL"
