name: Releasey Prepare RC

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version such as 1.2.3
        required: true
        type: string
      source_sha:
        description: Optional exact source commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: buildish-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-ref-checks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify GitHub checks on the resolved source ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=("$RELEASE_VERSION")
          if [[ -n "$INPUT_SOURCE_SHA" ]]; then
            args+=("$INPUT_SOURCE_SHA")
          fi
          bash buildish-release-tooling/release-tooling.sh verify-source-ref-checks \
            "${args[@]}"

  resolve-state:
    needs: verify-source-ref-checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare-rc.outputs.version }}
      rc_tag: ${{ steps.prepare-rc.outputs.rc_tag }}
      resolved_source_ref: ${{ steps.prepare-rc.outputs.resolved_source_ref }}
      source_date_epoch: ${{ steps.prepare-rc.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - id: prepare-rc
        name: Resolve release state and emit summary
        env:
          MANIFEST_PATH: ${{ runner.temp }}/prepare-rc.json
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=("$RELEASE_VERSION")
          if [[ -n "$INPUT_SOURCE_SHA" ]]; then
            args+=("$INPUT_SOURCE_SHA")
          fi
          bash buildish-release-tooling/release-tooling.sh prepare-rc \
            "${args[@]}"

  cleanup-dev-svn-rcs:
    needs: resolve-state
    runs-on: ubuntu-latest
    environment: draft-release-secrets
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
      BUILDISH_SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Delete pre-existing RC directories from ASF SVN dev dist
        env:
          BUILDISH_SVN_DEV_USERNAME: ${{ secrets.BUILDISH_SVN_DEV_USERNAME }}
          BUILDISH_SVN_DEV_PASSWORD: ${{ secrets.BUILDISH_SVN_DEV_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh cleanup-dev-svn-rcs \
            "$RELEASE_VERSION"

  build-source-rc:
    needs:
      - resolve-state
      - cleanup-dev-svn-rcs
    runs-on: ubuntu-latest
    environment: draft-release-secrets
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
      BUILDISH_SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Draft optional component tests
        run: |
          echo "TODO: if prepare_rc_runs_tests=true, run the component test suite here. Otherwise rely on the verified release-branch CI gate."
      - name: Build, sign, and stage source RC
        env:
          BUILDISH_SVN_DEV_USERNAME: ${{ secrets.BUILDISH_SVN_DEV_USERNAME }}
          BUILDISH_SVN_DEV_PASSWORD: ${{ secrets.BUILDISH_SVN_DEV_PASSWORD }}
          BUILDISH_GPG_PRIVATE_KEY: ${{ secrets.BUILDISH_GPG_PRIVATE_KEY }}
          BUILDISH_GPG_PASSPHRASE: ${{ secrets.BUILDISH_GPG_PASSPHRASE }}
          RC_TAG: ${{ needs.resolve-state.outputs.rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=(--rc-tag "$RC_TAG" "$RELEASE_VERSION")
          if [[ -n "$INPUT_SOURCE_SHA" ]]; then
            args+=("$INPUT_SOURCE_SHA")
          fi
          bash buildish-release-tooling/release-tooling.sh build-source-rc \
            "${args[@]}"

  create-rc-tag:
    needs:
      - resolve-state
      - build-source-rc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
      BUILDISH_SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Create the RC tag
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.resolve-state.outputs.rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=(--rc-tag "$RC_TAG" "$RELEASE_VERSION")
          if [[ -n "$INPUT_SOURCE_SHA" ]]; then
            args+=("$INPUT_SOURCE_SHA")
          fi
          bash buildish-release-tooling/release-tooling.sh create-rc-materialization-tag \
            "${args[@]}"

  sync-draft-github-release:
    needs:
      - resolve-state
      - build-source-rc
      - create-rc-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
      BUILDISH_SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Create or recreate the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.resolve-state.outputs.rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=(--rc-tag "$RC_TAG" "$RELEASE_VERSION")
          if [[ -n "$INPUT_SOURCE_SHA" ]]; then
            args+=("$INPUT_SOURCE_SHA")
          fi
          bash buildish-release-tooling/release-tooling.sh sync-draft-github-release \
            "${args[@]}"

  finalize-rc-vote-materials:
    needs:
      - resolve-state
      - sync-draft-github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: draft-release-secrets
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
      BUILDISH_SOURCE_DATE_EPOCH: ${{ needs.resolve-state.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11 for uv-managed commands
        run: uv python install 3.11
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Stage and mirror the authoritative RC vote manifest
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDISH_GPG_PRIVATE_KEY: ${{ secrets.BUILDISH_GPG_PRIVATE_KEY }}
          BUILDISH_GPG_PASSPHRASE: ${{ secrets.BUILDISH_GPG_PASSPHRASE }}
          RC_TAG: ${{ needs.resolve-state.outputs.rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=(--rc-tag "$RC_TAG" "$RELEASE_VERSION")
          if [[ -n "$INPUT_SOURCE_SHA" ]]; then
            args+=("$INPUT_SOURCE_SHA")
          fi
          bash buildish-release-tooling/release-tooling.sh finalize-rc-vote-materials \
            "${args[@]}"
