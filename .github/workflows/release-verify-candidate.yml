name: Release Verify Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact candidate tag to verify
        required: true
        type: string
      candidate_manifest_digest:
        description: Exact lowercase SHA-256 of candidate-manifest.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - env:
          CANDIDATE_MANIFEST_DIGEST: ${{ inputs.candidate_manifest_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ runner.temp }}/verification/verification-result.json
        run: |
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          bash buildish-release-tooling/release-tooling.sh verify-github-candidate \
            --candidate-tag "$CANDIDATE_TAG" \
            --candidate-manifest-digest "$CANDIDATE_MANIFEST_DIGEST" \
            --candidate-manifest-output "${{ runner.temp }}/verification/candidate-manifest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          retention-days: 30
          if-no-files-found: error
