name: Release Direct To TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version, such as 0.1.0
        required: true
        type: string
      source_ref:
        description: Optional exact source ref or commit; defaults to protected main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: buildish-testpypi-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

# This workflow resolves real DirectReleaseState but intentionally exercises
# only its secondary TestPyPI publication, without creating a tag or Release.
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.state.outputs.source_commit }}
      state_digest: ${{ steps.state.outputs.state_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - id: state
        name: Resolve exact Buildish direct-release state
        env:
          BUILDISH_COMPONENT_CONFIG_PATH: ${{ github.workspace }}/buildish-release-tooling/release-testpypi-config.yaml
          MANIFEST_PATH: ${{ runner.temp }}/direct-state/direct-state.json
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          args=("$RELEASE_VERSION")
          if [[ -n "$SOURCE_REF" ]]; then args+=("$SOURCE_REF"); fi
          bash buildish-release-tooling/release-tooling.sh resolve-direct-release "${args[@]}"
          python3 - "$MANIFEST_PATH" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"source_commit={payload['source']['commit_sha']}")
          print(f"state_digest={hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-direct-state-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-state
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  verify-source:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify trusted required source checks
        env:
          BUILDISH_COMPONENT_CONFIG_PATH: ${{ github.workspace }}/buildish-release-tooling/release-testpypi-config.yaml
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: >-
          bash buildish-release-tooling/release-tooling.sh
          verify-source-ref-checks "$RELEASE_VERSION" "$SOURCE_COMMIT"

  build:
    needs: [resolve, verify-source]
    runs-on: ubuntu-latest
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
    steps:
      - name: Check out exact selected source as build input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv python install 3.11
      - name: Build and verify reproducible distributions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: >-
          tools/release/build-python-distributions.sh
          "$RELEASE_VERSION"
          "$SOURCE_COMMIT"
          "$RUNNER_TEMP/distribution-bundle/distributions"
      - id: bundle
        name: Bind distribution artifact bytes
        run: |
          cd "$RUNNER_TEMP/distribution-bundle"
          find distributions -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > distributions.sha256
          printf 'bundle_digest=%s\n' "$(sha256sum distributions.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-distributions-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution-bundle
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  inspect:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    outputs:
      publication_state: ${{ steps.inspect.outputs.publication_state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-direct-state-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-state
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-distributions-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution-bundle
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - id: inspect
        name: Inspect existing TestPyPI state
        env:
          BUILDISH_COMPONENT_CONFIG_PATH: ${{ github.workspace }}/buildish-release-tooling/release-testpypi-config.yaml
          EXPECTED_BUNDLE_DIGEST: ${{ needs.build.outputs.bundle_digest }}
          EXPECTED_STATE_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          MANIFEST_PATH: ${{ runner.temp }}/testpypi-inspection/testpypi-inspection-result.json
          RELEASE_VERSION: ${{ inputs.version }}
          STATE_PATH: ${{ runner.temp }}/direct-state/direct-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_STATE_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          cd "$RUNNER_TEMP/distribution-bundle"
          printf '%s  %s\n' "$EXPECTED_BUNDLE_DIGEST" distributions.sha256 | sha256sum --check --strict
          sha256sum --check --strict distributions.sha256
          cd "$GITHUB_WORKSPACE"
          mapfile -d '' distributions < <(find "$RUNNER_TEMP/distribution-bundle/distributions" -maxdepth 1 -type f -print0 | sort -z)
          bash buildish-release-tooling/release-tooling.sh verify-pypi-publication \
            --allow-incomplete \
            --release-state "$STATE_PATH" \
            "$RELEASE_VERSION" \
            "${distributions[@]}"

  publish:
    if: ${{ needs.inspect.outputs.publication_state != 'complete' }}
    needs: [resolve, build, inspect]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/buildish-release-tooling/${{ inputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download exact distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-distributions-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution-bundle
      - name: Verify distribution producer binding
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ needs.build.outputs.bundle_digest }}
        run: |
          cd "$RUNNER_TEMP/distribution-bundle"
          printf '%s  %s\n' "$EXPECTED_BUNDLE_DIGEST" distributions.sha256 | sha256sum --check --strict
          sha256sum --check --strict distributions.sha256
      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/distribution-bundle/distributions
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify:
    if: >-
      ${{ always()
          && needs.resolve.result == 'success'
          && needs.build.result == 'success'
          && needs.inspect.result == 'success'
          && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    needs: [resolve, build, inspect, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-direct-state-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-state
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-distributions-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution-bundle
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - name: Verify exact published TestPyPI state
        env:
          BUILDISH_COMPONENT_CONFIG_PATH: ${{ github.workspace }}/buildish-release-tooling/release-testpypi-config.yaml
          EXPECTED_BUNDLE_DIGEST: ${{ needs.build.outputs.bundle_digest }}
          EXPECTED_STATE_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          MANIFEST_PATH: ${{ runner.temp }}/testpypi-publication/testpypi-publication-result.json
          RELEASE_VERSION: ${{ inputs.version }}
          STATE_PATH: ${{ runner.temp }}/direct-state/direct-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_STATE_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          cd "$RUNNER_TEMP/distribution-bundle"
          printf '%s  %s\n' "$EXPECTED_BUNDLE_DIGEST" distributions.sha256 | sha256sum --check --strict
          sha256sum --check --strict distributions.sha256
          cd "$GITHUB_WORKSPACE"
          mapfile -d '' distributions < <(find "$RUNNER_TEMP/distribution-bundle/distributions" -maxdepth 1 -type f -print0 | sort -z)
          bash buildish-release-tooling/release-tooling.sh verify-pypi-publication \
            --attempts 12 \
            --retry-delay 5 \
            --release-state "$STATE_PATH" \
            "$RELEASE_VERSION" \
            "${distributions[@]}"
          MANIFEST_PATH="$RUNNER_TEMP/testpypi-publication/attestations/attestation-evidence.json" \
          bash buildish-release-tooling/release-tooling.sh verify-pypi-attestations \
            --provenance-dir "$RUNNER_TEMP/testpypi-publication/attestations/provenance" \
            "$RELEASE_VERSION" \
            "${distributions[@]}"
          cd "$RUNNER_TEMP/testpypi-publication"
          find . -type f ! -name publication-evidence.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > publication-evidence.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/testpypi-publication
          retention-days: 30
          if-no-files-found: error
          overwrite: true
