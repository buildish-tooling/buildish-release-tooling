name: Release Direct

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact final version, such as 1.2.3
        required: true
        type: string
      source_ref:
        description: Optional exact source ref or commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: buildish-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.state.outputs.source_commit }}
      state_digest: ${{ steps.state.outputs.state_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - id: state
        name: Resolve exact direct-release state
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          MANIFEST_PATH: ${{ runner.temp }}/direct-state/release-state.json
        run: |
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          args=("$RELEASE_VERSION")
          if [[ -n "$SOURCE_REF" ]]; then args+=("$SOURCE_REF"); fi
          bash buildish-release-tooling/release-tooling.sh resolve-direct-release "${args[@]}"
          python3 - "$MANIFEST_PATH" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"source_commit={payload['source']['commit_sha']}")
          print(f"state_digest={hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: direct-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-state
          retention-days: 1
          if-no-files-found: error

  verify-source:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: bash buildish-release-tooling/release-tooling.sh verify-source-ref-checks "$RELEASE_VERSION" "$SOURCE_COMMIT"

  create-final-tag:
    needs: [resolve, verify-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: direct-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-state
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - env:
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ runner.temp }}/final-tag-result.json
          STATE_PATH: ${{ runner.temp }}/direct-state/release-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          bash buildish-release-tooling/release-tooling.sh create-final-tag --release-state "$STATE_PATH"

  stage:
    needs: [resolve, create-final-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: direct-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-state
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - env:
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ runner.temp }}/stage-result/stage-result.json
          STATE_PATH: ${{ runner.temp }}/direct-state/release-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          bash buildish-release-tooling/release-tooling.sh stage-github-final-release --release-state "$STATE_PATH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: direct-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-result
          retention-days: 1
          if-no-files-found: error

  verify-final:
    needs: [resolve, stage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: direct-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-state
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - env:
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          GH_TOKEN: ${{ github.token }}
          STATE_PATH: ${{ runner.temp }}/direct-state/release-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          bash buildish-release-tooling/release-tooling.sh verify-github-final-release --release-state "$STATE_PATH"

  publish:
    needs: [resolve, verify-final]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publication_digest: ${{ steps.publish.outputs.publication_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: direct-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-state
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - id: publish
        env:
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ runner.temp }}/publication/publication-result.json
          STATE_PATH: ${{ runner.temp }}/direct-state/release-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          bash buildish-release-tooling/release-tooling.sh publish-github-final-release --release-state "$STATE_PATH"
          printf 'publication_digest=%s\n' "$(sha256sum "$MANIFEST_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: direct-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: direct-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-state
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: direct-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - env:
          EXPECTED_PUBLICATION_DIGEST: ${{ needs.publish.outputs.publication_digest }}
          EXPECTED_STATE_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ runner.temp }}/release-manifest/release-manifest-v1.json
          PUBLICATION_PATH: ${{ runner.temp }}/publication/publication-result.json
          STATE_PATH: ${{ runner.temp }}/direct-state/release-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_STATE_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_PUBLICATION_DIGEST" "$PUBLICATION_PATH" | sha256sum --check --strict
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          bash buildish-release-tooling/release-tooling.sh create-release-manifest \
            --release-state "$STATE_PATH" \
            --publication-result "$PUBLICATION_PATH"
          bash buildish-release-tooling/release-tooling.sh attach-github-release-manifest \
            --release-state "$STATE_PATH" \
            --release-manifest "$MANIFEST_PATH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: direct-release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest
          retention-days: 30
          if-no-files-found: error
