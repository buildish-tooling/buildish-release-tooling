name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact final version, such as 1.2.3
        required: true
        type: string
      source_ref:
        description: Optional exact source ref or commit
        required: false
        type: string
      candidate_label:
        description: Optional candidate label override, such as rc
        required: false
        type: string
      vote_profile:
        description: Optional vote package profile configured by the component
        required: true
        default: none
        type: choice
        options: [none, generic, asf]

permissions:
  contents: read

concurrency:
  group: buildish-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

# Credential-bearing jobs execute this workflow revision. The selected source is
# checked out and executed only by the unprivileged build-distributions job.
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      candidate_tag: ${{ steps.state.outputs.candidate_tag }}
      source_commit: ${{ steps.state.outputs.source_commit }}
      state_digest: ${{ steps.state.outputs.state_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - id: state
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          MANIFEST_PATH: ${{ runner.temp }}/candidate-state/candidate-state.json
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          args=("$RELEASE_VERSION")
          if [[ -n "$SOURCE_REF" ]]; then args+=("$SOURCE_REF"); fi
          if [[ -n "$CANDIDATE_LABEL" ]]; then args=(--candidate-label "$CANDIDATE_LABEL" "${args[@]}"); fi
          bash buildish-release-tooling/release-tooling.sh resolve-candidate "${args[@]}"
          python3 - "$MANIFEST_PATH" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"candidate_tag={payload['candidate']['tag']['name']}")
          print(f"source_commit={payload['source']['commit_sha']}")
          print(f"state_digest={hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-state-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-state
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  verify-source:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - run: git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: bash buildish-release-tooling/release-tooling.sh verify-source-ref-checks "$RELEASE_VERSION" "$SOURCE_COMMIT"

  build-distributions:
    needs: [resolve, verify-source]
    runs-on: ubuntu-latest
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv python install 3.11
      - name: Build and verify reproducible distributions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: >-
          tools/release/build-python-distributions.sh
          "$RELEASE_VERSION"
          "$SOURCE_COMMIT"
          "$RUNNER_TEMP/distribution-bundle/distributions"
      - id: bundle
        name: Bind distribution artifact bytes
        run: |
          cd "$RUNNER_TEMP/distribution-bundle"
          find distributions -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > distributions.sha256
          printf 'bundle_digest=%s\n' "$(sha256sum distributions.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-distributions-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution-bundle
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  prepare-assets:
    needs: [resolve, build-distributions]
    runs-on: ubuntu-latest
    environment: release-candidate
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution-bundle
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - name: Verify distribution producer binding
        env:
          EXPECTED_DIGEST: ${{ needs.build-distributions.outputs.bundle_digest }}
        run: |
          cd "$RUNNER_TEMP/distribution-bundle"
          printf '%s  %s\n' "$EXPECTED_DIGEST" distributions.sha256 | sha256sum --check --strict
          sha256sum --check --strict distributions.sha256
      - name: Create checksums and OpenPGP signatures
        env:
          BUILDISH_GPG_PASSPHRASE: ${{ secrets.BUILDISH_RELEASE_GPG_PASSPHRASE }}
          BUILDISH_GPG_PRIVATE_KEY: ${{ secrets.BUILDISH_RELEASE_GPG_SECRET_SUBKEY }}
          EXPECTED_SIGNING_FINGERPRINT: ${{ vars.BUILDISH_RELEASE_GPG_SIGNING_FINGERPRINT }}
          MANIFEST_PATH: ${{ runner.temp }}/prepared-assets-result.json
        run: |
          mapfile -d '' assets < <(find "$RUNNER_TEMP/distribution-bundle/distributions" -maxdepth 1 -type f -print0 | sort -z)
          bash buildish-release-tooling/release-tooling.sh prepare-release-assets \
            --output-dir "$RUNNER_TEMP/candidate-asset-bundle/assets" \
            --expected-signing-fingerprint "$EXPECTED_SIGNING_FINGERPRINT" \
            "${assets[@]}"
      - id: bundle
        name: Bind prepared candidate asset bytes
        run: |
          cd "$RUNNER_TEMP/candidate-asset-bundle"
          find assets -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > assets.sha256
          printf 'bundle_digest=%s\n' "$(sha256sum assets.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-asset-bundle
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  publish-candidate:
    needs: [resolve, verify-source, prepare-assets]
    runs-on: ubuntu-latest
    environment: release-candidate
    permissions:
      contents: write
    outputs:
      manifest_digest: ${{ steps.publish.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-state-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-state
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-asset-bundle
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - id: publish
        env:
          CANDIDATE_TAG: ${{ needs.resolve.outputs.candidate_tag }}
          EXPECTED_ASSET_BUNDLE_DIGEST: ${{ needs.prepare-assets.outputs.bundle_digest }}
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.state_digest }}
          GH_TOKEN: ${{ github.token }}
          STATE_PATH: ${{ runner.temp }}/candidate-state/candidate-state.json
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$STATE_PATH" | sha256sum --check --strict
          cd "$RUNNER_TEMP/candidate-asset-bundle"
          printf '%s  %s\n' "$EXPECTED_ASSET_BUNDLE_DIGEST" assets.sha256 | sha256sum --check --strict
          sha256sum --check --strict assets.sha256
          cd "$GITHUB_WORKSPACE"
          mapfile -d '' assets < <(find "$RUNNER_TEMP/candidate-asset-bundle/assets" -maxdepth 1 -type f -print0 | sort -z)
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          MANIFEST_PATH="$RUNNER_TEMP/candidate-tag-result.json" \
            bash buildish-release-tooling/release-tooling.sh create-candidate-tag --candidate-state "$STATE_PATH"
          MANIFEST_PATH="$RUNNER_TEMP/candidate-stage-result.json" \
            bash buildish-release-tooling/release-tooling.sh stage-github-candidate \
              --candidate-state "$STATE_PATH" \
              "${assets[@]/#/--asset=}"
          mkdir -p "$RUNNER_TEMP/candidate-manifest"
          MANIFEST_PATH="$RUNNER_TEMP/candidate-manifest/candidate-manifest.json" \
            bash buildish-release-tooling/release-tooling.sh create-candidate-manifest \
              --candidate-state "$STATE_PATH" \
              --stage-result "$RUNNER_TEMP/candidate-stage-result.json"
          bash buildish-release-tooling/release-tooling.sh attach-github-candidate-manifest \
            --candidate-state "$STATE_PATH" \
            --candidate-manifest "$RUNNER_TEMP/candidate-manifest/candidate-manifest.json"
          manifest_digest="$(sha256sum "$RUNNER_TEMP/candidate-manifest/candidate-manifest.json" | cut -d' ' -f1)"
          bash buildish-release-tooling/release-tooling.sh verify-github-candidate \
            --candidate-tag "$CANDIDATE_TAG" \
            --candidate-manifest-digest "$manifest_digest"
          bash buildish-release-tooling/release-tooling.sh finalize-github-candidate \
            --candidate-tag "$CANDIDATE_TAG" \
            --candidate-manifest-digest "$manifest_digest"
          printf 'manifest_digest=%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-manifest
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  vote-package:
    if: ${{ inputs.vote_profile != 'none' }}
    needs: [resolve, publish-candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-manifest
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.11
      - env:
          EXPECTED_DIGEST: ${{ needs.publish-candidate.outputs.manifest_digest }}
          MANIFEST_PATH: ${{ runner.temp }}/vote-package/vote-package.json
          VOTE_PROFILE: ${{ inputs.vote_profile }}
        run: |
          candidate_manifest="$RUNNER_TEMP/candidate-manifest/candidate-manifest.json"
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$candidate_manifest" | sha256sum --check --strict
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          bash buildish-release-tooling/release-tooling.sh create-vote-package \
            --candidate-manifest "$candidate_manifest" \
            --profile "$VOTE_PROFILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vote-package-${{ github.run_id }}
          path: ${{ runner.temp }}/vote-package
          retention-days: 30
          if-no-files-found: error
          overwrite: true
