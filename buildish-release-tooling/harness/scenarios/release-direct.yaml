name: release-direct
backend: act
tool_behaviors:
  gh:
    - match:
        argv_contains: ["/check-runs?per_page=100"]
      result:
        stdout: '{"check_runs":[{"name":"Required Checks","status":"completed","conclusion":"success"}]}'
    - match:
        argv_contains: ["/status"]
      result:
        stdout: '{"statuses":[]}'
workflow:
  path: ../../../.github/workflows/release-direct.yml
  harness_config: ../release-harness.yaml
  inputs:
    version: 1.2.3
    source_ref: main
  real_cli_commands:
    - resolve-direct-release
    - verify-source-ref-checks
    - create-final-tag
    - stage-github-final-release
    - verify-github-final-release
    - publish-github-final-release
    - create-release-manifest
    - attach-github-release-manifest
