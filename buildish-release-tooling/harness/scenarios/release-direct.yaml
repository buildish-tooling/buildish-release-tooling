name: release-direct
backend: act
tool_behaviors:
  gh:
    - match:
        argv_contains: ["/check-runs?per_page=100"]
      result:
        stdout: '{"check_runs":[{"name":"component-ci","status":"completed","conclusion":"success"}]}'
    - match:
        argv_contains: ["/status"]
      result:
        stdout: '{"statuses":[]}'
workflow:
  path: ../../../.github/workflows/release-direct.yml
  harness_config: ../release-harness.yaml
  inputs:
    version: 1.2.3
    source_ref: main
  real_cli_commands:
    - resolve-direct-release
    - verify-source-ref-checks
    - create-final-tag
    - stage-github-final-release
    - verify-github-final-release
    - publish-github-final-release
    - create-release-manifest
    - attach-github-release-manifest
  release_config:
    component:
      id: buildish-release-tooling
      display_name: Buildish Release Tooling
    versioning:
      scheme: semver
      final_tag_template: "v{version}"
    source:
      selection: explicit-ref-or-default-branch
      default_branch: main
      snapshot:
        mode: platform-generated
      checks:
        run_selected_ref_tests: false
        require_release_branch_ci: true
    lifecycle:
      mode: direct
    artifacts:
      produced: []
      checksums: []
    publication:
      authoritative:
        kind: github-release
        repository: buildish-tooling/buildish-release-tooling
    tags:
      final_mode: exact-source-commit
      moving: []
    policy_profiles: {}
