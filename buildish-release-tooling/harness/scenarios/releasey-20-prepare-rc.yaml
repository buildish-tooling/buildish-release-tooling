name: releasey-prepare-rc
backend: act
secrets:
  BUILDISH_SVN_DEV_USERNAME: release-user
  BUILDISH_SVN_DEV_PASSWORD: release-password
tool_behaviors:
  gh:
    - match:
        argv_contains:
          - /check-runs?per_page=100
      result:
        stdout: |
          {"check_runs":[{"name":"release-branch-ci","status":"completed","conclusion":"success"}]}
    - match:
        argv_contains:
          - /status
      result:
        stdout: |
          {"statuses":[{"context":"required-status","state":"success"}]}
    - match:
        argv:
          - api
          - -H
          - "Accept: application/vnd.github+json"
          - repos/buildish-tooling/buildish-release-tooling/releases?per_page=100
      times: 1
      result:
        stdout: |
          []
    - match:
        argv_prefix:
          - api
          - -X
          - POST
          - -H
          - "Accept: application/vnd.github+json"
          - repos/buildish-tooling/buildish-release-tooling/releases
          - --input
          - "-"
      times: 1
      result:
        stdout: |
          {"id":123,"draft":true,"name":"Buildish Release Tooling 1.2.3","tag_name":"v1.2.3-rc1","html_url":"https://github.com/buildish-tooling/buildish-release-tooling/releases/tag/v1.2.3-rc1"}
    - match:
        argv:
          - api
          - -H
          - "Accept: application/vnd.github+json"
          - repos/buildish-tooling/buildish-release-tooling/releases?per_page=100
      times: 1
      result:
        stdout: |
          [{"id":123,"draft":true,"name":"Buildish Release Tooling 1.2.3","tag_name":"v1.2.3-rc1","html_url":"https://github.com/buildish-tooling/buildish-release-tooling/releases/tag/v1.2.3-rc1","body":"Draft GitHub Release placeholder for Buildish Release Tooling 1.2.3.\n\nRC tag: v1.2.3-rc1\nFinal tag: v1.2.3\nResolved source ref: d232c22\nASF SVN staging URL: file:///tmp/placeholder\nFinal tag mode: rc-source-commit\n\nThis draft release is convenience metadata only and must remain unpublished until the ASF vote passes."}]
    - match:
        argv_prefix:
          - release
          - upload
          - v1.2.3-rc1
      times: 1
      result:
        stdout: ""
workflow:
  path: ../../../.github/workflows/releasey-20-prepare-rc.yml
  harness_config: ../release-harness.yaml
  inputs:
    version: 1.2.3
    source_sha: ""
  real_cli_commands:
    - verify-source-ref-checks
    - prepare-rc
    - cleanup-dev-svn-rcs
    - build-source-rc
    - create-rc-materialization-tag
    - sync-draft-github-release
    - finalize-rc-vote-materials
  repository_fixture:
    branches:
      - name: release/1.2.x
  gpg_fixture: generated-signing-key
  svn_fixture:
    initial_state: preexisting-current-rc
    rc_number: 0
    repository_files:
      - path: repos/dist/release/incubator/buildish/KEYS
        content: |
          pub   ed25519 2026-01-01 [SC]
                0123456789ABCDEF0123456789ABCDEF01234567
          uid           Buildish Release Harness <buildish-release-harness@example.invalid>
