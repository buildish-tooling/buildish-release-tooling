name: basic-success
env_capture:
  - SCENARIO_FLAG
env:
  SCENARIO_FLAG: enabled
workspace_files:
  - path: repo/README.md
    content: |
      hello
tool_behaviors:
  gh:
    - match:
        argv_prefix: [api, repos/demo]
      result:
        stdout: "{\"ok\":true}\n"
jobs:
  - id: prepare
    steps:
      - id: call-gh
        cwd: repo
        run: |
          gh api repos/demo
          printf 'summary ok\n' >> "$GITHUB_STEP_SUMMARY"
