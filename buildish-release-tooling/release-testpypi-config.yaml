component:
  id: buildish-release-tooling
  display_name: Buildish Release Tooling
versioning:
  scheme: semver
  final_tag_template: "v{version}"
source:
  selection: explicit-ref-or-default-branch
  default_branch: main
  # The rehearsal accepts the same protected source set as production release.
  require_default_branch_ancestor: true
  snapshot:
    mode: platform-generated
  checks:
    platform: github
    trusted_workflow_path: .github/workflows/ci.yml
    trusted_event: push
    trusted_branch: main
    required:
      - Required Checks
# The workflow uses this direct state for TestPyPI only; it does not publish the
# configured authoritative GitHub target.
lifecycle:
  mode: direct
artifacts:
  produced:
    - python-wheel
    - python-sdist
  checksums: []
publication:
  authoritative:
    kind: github-release
    repository: buildish-tooling/buildish-release-tooling
  convenience: []
  secondary:
    - kind: pypi
      project_name: buildish-release-tooling
      repository_api_url: https://test.pypi.org/pypi
      project_url_template: https://test.pypi.org/project/{project}/{version}/
      integrity_api_url: https://test.pypi.org/integrity
      trusted_publisher:
        kind: GitHub
        repository: buildish-tooling/buildish-release-tooling
        workflow: release-testpypi.yml
        environment: testpypi
tags:
  final_mode: exact-source-commit
  moving: []
policy_profiles: {}
