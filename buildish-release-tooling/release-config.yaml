component_id: buildish-release-tooling
source_artifact_prefix: apache-buildish-release-tooling
asf_dist_dev_base: https://dist.apache.org/repos/dist/dev/incubator/buildish/buildish-release-tooling
asf_dist_release_base: https://dist.apache.org/repos/dist/release/incubator/buildish/buildish-release-tooling
moving_tags_enabled: false
latest_tag_enabled: false
secondary_targets: []
final_tag_mode: rc-source-commit
vote_release_name: Apache Buildish Release Tooling
incubator_vote_enabled: true
release_summary_include_final_tag_mode: false
release_verification_guide_url: https://buildish.apache.org/buildish-release-tooling/release-verification/
verify_rc_instructions: |
  Run this verification flow on trusted Linux or macOS hardware:
  1. verify .sha512
  2. verify .asc
  3. rebuild the source release from the tagged source commit
  4. compare the rebuilt source archive with the staged RC source archive
prepare_rc_runs_tests: false
release_branch_ci_required: true
